<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Bookstore</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header><h1>Online Bookstore</h1><p>AI SDLC capstone application</p></header>
<main>
<nav aria-label="Book categories">
<button class="tab active" data-category="">All Books</button>
<button class="tab" data-category="Fiction">Fiction Books</button>
<button class="tab" data-category="Non-Fiction">Non-Fiction Books</button>
</nav>
<h2 id="section-title">All Books</h2>
<section id="book-list" class="book-grid" aria-live="polite"></section>
<p id="error" class="error" hidden></p>
</main>
<script src="/app.js"></script>
</body>
</html>
